name: CI
on:
  push:
    branches: [main, chore/repository-cleanup]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Type check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: frontdesk
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: frontdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frontdesk -d frontdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://frontdesk:ci-only-password@localhost:5432/frontdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run check
